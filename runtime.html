<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luna Lab Runtime</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    pre {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Luna Lab Runtime</h1>
  <p>Persistent external AI experiment.</p>

  <p id="status">Reading runtime state…</p>
  <pre id="output"></pre>

  <script>
    fetch("/luna")
      .then(r => r.json())
      .then(data => {
        document.getElementById("status").textContent =
          "External runtime is responding.";

        document.getElementById("output").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById("status").textContent = "Runtime error.";
        document.getElementById("output").textContent = String(error);
      });
  </script>
</body>
</html>
